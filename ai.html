<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infintech Designs — AI & Automation Agency Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   POSITIONING — corrected 2026-08-12.
   This is an AI-driven AUTOMATION + digital marketing agency,
   and a Google Premier Partner. Not a warm local service shop.
   Every direction below leads with the system, not the city.

   Brand tokens still from the live site:
   #EA4517 flame (action) · #ED9924 amber · #273A47 slate ·
   #121212 ink · Raleway body / Montserrat display.
   Cool neutral base + JetBrains Mono for machine voice are the
   deliberate additions that carry the automation identity.
   ============================================================ */
:root{
  --flame:#EA4517; --flame-dk:#C4380F; --amber:#ED9924;
  --slate:#273A47; --ink:#121212;
  --bg:#0B0F14; --bg-2:#0E141B; --panel:#111922; --line:#1E2A36;
  --fg:#E8EDF2; --fg-2:#9FB0C0; --fg-3:#63788A;
  --live:#3ECF8E;
  --sans:'Raleway',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --display:'Montserrat','Raleway',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);-webkit-font-smoothing:antialiased;background:var(--bg)}
#stage{min-height:100vh}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,40px)}
a{text-decoration:none}
.mono{font-family:var(--mono)}
.mark img{height:46px;width:auto;display:block}
@media (max-width:720px){.mark img{height:34px}}

/* ============================================================
   ==============  DIRECTION 1 — SIGNAL  ======================
   Dark, product-grade. The hero runs a live automation graph:
   jobs entering, routing, and clearing. The ONLY animated one.
   ============================================================ */
.p-signal{--bg:#F4F7F9;--bg-2:#EAEFF3;--panel:#FFFFFF;--line:#DCE4EA;--fg:#0E1820;--fg-2:#4C5C6A;--fg-3:#7B8B99;background:var(--bg);color:var(--fg);font-size:16px}
.p-signal .hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.p-signal .hero-bg{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(80% 70% at 76% 40%,rgba(39,58,71,.10) 0%,rgba(244,247,249,0) 62%),
             linear-gradient(180deg,#FFFFFF 0%,#F4F7F9 72%)}
.p-signal .hero-bg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.p-signal .hero-bg .grid{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(70% 60% at 50% 40%,#000 0%,transparent 100%);
  mask-image:radial-gradient(70% 60% at 50% 40%,#000 0%,transparent 100%)}
.p-signal .hero>.wrap{position:relative;z-index:1}

.p-signal .nav{display:flex;align-items:center;gap:28px;padding:18px 0;
  border-bottom:1px solid var(--line);position:relative;z-index:2;background:rgba(255,255,255,.78);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.p-signal .mark{display:block;flex:none}
.p-signal .nav .links{display:flex;gap:24px;margin-left:auto}
.p-signal .nav .links a{color:var(--fg-2);font-size:13.5px;font-weight:600}
.p-signal .nav .links a:hover{color:var(--fg)}
.p-signal .nav .tel{padding:10px 18px;border-radius:8px;background:var(--flame);color:#fff;
  font-size:13.5px;font-weight:700}

.p-signal .hero-in{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;
  align-items:center;padding:clamp(44px,5.5vw,76px) 0 clamp(48px,5.5vw,80px)}
.p-signal .badge{display:inline-flex;align-items:center;gap:9px;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);margin-bottom:22px}
.p-signal .badge i{width:6px;height:6px;border-radius:50%;background:var(--live);
  box-shadow:0 0 0 3px rgba(62,207,142,.16);font-style:normal}
.p-signal .badge span{font-family:var(--mono);font-size:11.5px;font-weight:500;
  letter-spacing:.04em;color:var(--fg-2)}
.p-signal h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,4.6vw,58px);
  line-height:1.06;letter-spacing:-.024em;margin:0 0 22px;color:var(--fg);text-wrap:balance}
.p-signal h1 em{font-style:normal;color:var(--flame)}
.p-signal .lede{font-size:clamp(15px,1.25vw,18px);line-height:1.62;color:var(--fg-2);
  max-width:52ch;margin:0 0 30px}
.p-signal .cta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:34px}
.p-signal .b1{display:inline-flex;align-items:center;gap:9px;padding:14px 26px;border-radius:9px;
  background:var(--flame);color:#fff;font-size:15px;font-weight:700;
  box-shadow:0 8px 24px rgba(234,69,23,.3);transition:transform .16s cubic-bezier(.23,1,.32,1)}
.p-signal .b1:hover{transform:translateY(-2px)}
.p-signal .b2{display:inline-flex;align-items:center;padding:14px 24px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:15px;font-weight:600;
  transition:border-color .16s ease-out}
.p-signal .b2:hover{border-color:var(--fg-3)}
.p-signal .partner{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;padding-top:22px;border-top:1px solid var(--line)}
.p-signal .partner .g{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;
  color:var(--fg-3);letter-spacing:.03em}
.p-signal .partner .g b{color:var(--fg);font-weight:700}
.p-signal .partner .dot{width:1px;height:14px;background:var(--line)}

/* live job console beside the graph */
.p-signal .console{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.92);box-shadow:0 20px 50px rgba(14,24,32,.10);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow:hidden}
.p-signal .console header{display:flex;align-items:center;gap:8px;padding:12px 16px;
  border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--fg-3)}
.p-signal .console header i{width:7px;height:7px;border-radius:50%;background:var(--live);font-style:normal}
.p-signal .console header b{color:var(--fg-2);font-weight:500}
.p-signal .console header .t{margin-left:auto}
.p-signal .console ul{margin:0;padding:8px 0;list-style:none}
.p-signal .console li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  padding:9px 16px;font-family:var(--mono);font-size:12px;color:var(--fg-2);
  border-bottom:1px solid rgba(220,228,234,.9)}
.p-signal .console li:last-child{border-bottom:0}
.p-signal .console li .k{color:var(--fg-3)}
.p-signal .console li .s{padding:3px 8px;border-radius:5px;font-size:10.5px;font-weight:700;letter-spacing:.04em}
.p-signal .console li .ok{background:rgba(62,207,142,.12);color:var(--live)}
.p-signal .console li .run{background:rgba(237,153,36,.12);color:var(--amber)}

.p-signal section{padding:clamp(58px,7vw,100px) 0;border-bottom:1px solid var(--line)}
.p-signal .kicker{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--flame);margin:0 0 14px}
.p-signal h2{font-family:var(--display);font-weight:800;font-size:clamp(25px,3.2vw,40px);
  line-height:1.14;letter-spacing:-.02em;margin:0 0 16px;color:var(--fg);text-wrap:balance;max-width:22ch}
.p-signal .sec-lede{font-size:16.5px;line-height:1.62;color:var(--fg-2);max-width:60ch;margin:0 0 44px}

.p-signal .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.p-signal .step{padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--panel);
  position:relative;transition:border-color .2s ease-out}
.p-signal .step:hover{border-color:var(--fg-3)}
.p-signal .step .n{font-family:var(--mono);font-size:11.5px;color:var(--flame);margin-bottom:14px;display:block}
.p-signal .step h3{font-family:var(--display);font-size:17px;font-weight:700;margin:0 0 8px;color:var(--fg)}
.p-signal .step p{font-size:14px;line-height:1.6;color:var(--fg-2);margin:0}

.p-signal .pains{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.p-signal .pain{padding:26px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.p-signal .pain .v{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--fg-3);margin:0 0 14px}
.p-signal .pain h3{font-family:var(--display);font-size:18px;font-weight:700;margin:0 0 10px;color:var(--fg)}
.p-signal .pain p{font-size:14.5px;line-height:1.6;color:var(--fg-2);margin:0 0 16px}
.p-signal .pain .fix{display:flex;gap:9px;align-items:flex-start;padding-top:14px;
  border-top:1px solid var(--line);font-size:13.5px;color:var(--fg-2)}
.p-signal .pain .fix i{color:var(--live);font-style:normal;font-weight:700}

.p-signal .svc{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.p-signal .svc a{padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  color:var(--fg);font-size:14.5px;font-weight:600;display:flex;justify-content:space-between;gap:10px;
  transition:border-color .16s ease-out,color .16s ease-out}
.p-signal .svc a:hover{border-color:var(--flame)}
.p-signal .svc a i{font-style:normal;color:var(--fg-3)}

.p-signal .faq details{border-top:1px solid var(--line)}
.p-signal .faq details:last-of-type{border-bottom:1px solid var(--line)}
.p-signal .faq summary{list-style:none;cursor:pointer;padding:20px 0;display:flex;gap:16px;
  align-items:center;font-family:var(--display);font-size:17px;font-weight:700;color:var(--fg)}
.p-signal .faq summary::-webkit-details-marker{display:none}
.p-signal .faq summary::after{content:'+';margin-left:auto;color:var(--flame);font-size:21px;font-weight:400}
.p-signal .faq details[open] summary::after{content:'\2212'}
.p-signal .faq p{margin:0 0 22px;font-size:15px;line-height:1.7;color:var(--fg-2);max-width:74ch}
.p-signal footer{padding:40px 0;color:var(--fg-3);font-size:13.5px;display:flex;flex-wrap:wrap;gap:14px}
.p-signal footer a{color:var(--fg-2)}
.p-signal .rev{opacity:0;transform:translateY(14px);
  transition:opacity .42s cubic-bezier(.16,1,.3,1),transform .42s cubic-bezier(.16,1,.3,1)}
.p-signal .rev.in{opacity:1;transform:none}

/* ============================================================
   ==============  DIRECTION 2 — OPERATOR  ====================
   Light, software-product. Reads like a platform you can buy,
   not an agency you must brief. No motion.
   ============================================================ */
.p-operator{background:#FBFBFC;color:#0D1520;font-size:16px}
.p-operator .nav{display:flex;align-items:center;gap:28px;padding:18px 0;border-bottom:1px solid #E6E9ED}
.p-operator .mark{display:block;flex:none}
.p-operator .nav .links{display:flex;gap:24px;margin-left:auto}
.p-operator .nav .links a{color:#5A6675;font-size:13.5px;font-weight:600}
.p-operator .nav .links a:hover{color:#0D1520}
.p-operator .nav .tel{padding:10px 18px;border-radius:8px;background:#0D1520;color:#fff;font-size:13.5px;font-weight:700}

.p-operator .hero{padding:clamp(50px,6.5vw,88px) 0;text-align:center;border-bottom:1px solid #E6E9ED;
  background:radial-gradient(70% 60% at 50% 0%,#F2F4F7 0%,#FBFBFC 70%)}
.p-operator .badge{display:inline-flex;align-items:center;gap:9px;padding:7px 14px;border-radius:999px;
  border:1px solid #E0E4E9;background:#fff;margin-bottom:24px;
  font-family:var(--mono);font-size:11.5px;color:#5A6675}
.p-operator .badge i{width:6px;height:6px;border-radius:50%;background:var(--live);font-style:normal}
.p-operator h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,4.7vw,58px);
  line-height:1.06;letter-spacing:-.026em;margin:0 auto 20px;max-width:17ch;text-wrap:balance}
.p-operator h1 em{font-style:normal;color:var(--flame)}
.p-operator .lede{font-size:17.5px;line-height:1.6;color:#5A6675;max-width:60ch;margin:0 auto 30px}
.p-operator .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.p-operator .b1{padding:14px 28px;border-radius:9px;background:var(--flame);color:#fff;
  font-size:15px;font-weight:700;box-shadow:0 8px 22px rgba(234,69,23,.24)}
.p-operator .b2{padding:14px 26px;border-radius:9px;border:1px solid #D8DDE4;background:#fff;
  color:#0D1520;font-size:15px;font-weight:600}
.p-operator .fine{font-family:var(--mono);font-size:11.5px;color:#8A94A1}

/* the workflow board — the product shot, built in CSS */
.p-operator .board{margin-top:44px;border:1px solid #E2E6EB;border-radius:16px;background:#fff;
  box-shadow:0 24px 60px rgba(13,21,32,.09);overflow:hidden;text-align:left}
.p-operator .board header{display:flex;align-items:center;gap:8px;padding:13px 18px;
  border-bottom:1px solid #EDF0F3;background:#FAFBFC;font-family:var(--mono);font-size:11.5px;color:#8A94A1}
.p-operator .board header i{width:9px;height:9px;border-radius:50%;background:#E2E6EB;font-style:normal}
.p-operator .board header i:nth-of-type(2){background:#EDEFF2}
.p-operator .board header b{margin-left:8px;color:#5A6675;font-weight:500}
.p-operator .lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.p-operator .lane{border-right:1px solid #EDF0F3;padding:16px}
.p-operator .lane:last-child{border-right:0}
.p-operator .lane h4{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:#8A94A1;margin:0 0 14px;display:flex;align-items:center;gap:7px}
.p-operator .lane h4 s{width:6px;height:6px;border-radius:50%;background:var(--flame);text-decoration:none}
.p-operator .lane:nth-child(2) h4 s{background:var(--amber)}
.p-operator .lane:nth-child(3) h4 s{background:#5B9BD5}
.p-operator .lane:nth-child(4) h4 s{background:var(--live)}
.p-operator .job{border:1px solid #E8ECF0;border-radius:9px;padding:12px;margin-bottom:9px;background:#fff}
.p-operator .job b{display:block;font-size:13.5px;font-weight:700;margin-bottom:5px;color:#0D1520}
.p-operator .job span{display:block;font-family:var(--mono);font-size:11px;color:#8A94A1}

.p-operator section{padding:clamp(54px,6.5vw,88px) 0;border-bottom:1px solid #E6E9ED}
.p-operator .kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--flame);margin:0 0 12px}
.p-operator h2{font-family:var(--display);font-weight:800;font-size:clamp(25px,3.2vw,38px);
  line-height:1.14;letter-spacing:-.022em;margin:0 0 14px;max-width:22ch;text-wrap:balance}
.p-operator .sec-lede{font-size:16.5px;line-height:1.6;color:#5A6675;max-width:60ch;margin:0 0 40px}
.p-operator .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.p-operator .step{padding:22px;border:1px solid #E6E9ED;border-radius:12px;background:#fff}
.p-operator .step .n{font-family:var(--mono);font-size:11.5px;color:var(--flame);display:block;margin-bottom:12px}
.p-operator .step h3{font-family:var(--display);font-size:17px;font-weight:700;margin:0 0 8px}
.p-operator .step p{font-size:14px;line-height:1.58;color:#5A6675;margin:0}
.p-operator .pains{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.p-operator .pain{padding:24px;border:1px solid #E6E9ED;border-radius:12px;background:#fff}
.p-operator .pain .v{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:#8A94A1;margin:0 0 12px}
.p-operator .pain h3{font-family:var(--display);font-size:18px;font-weight:700;margin:0 0 10px}
.p-operator .pain p{font-size:14.5px;line-height:1.58;color:#5A6675;margin:0 0 14px}
.p-operator .pain .fix{display:flex;gap:9px;padding-top:13px;border-top:1px solid #EDF0F3;
  font-size:13.5px;color:#3C4757}
.p-operator .pain .fix i{color:var(--live);font-style:normal;font-weight:700}
.p-operator .svc{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.p-operator .svc a{padding:17px;border:1px solid #E6E9ED;border-radius:10px;background:#fff;color:#0D1520;
  font-size:14.5px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.p-operator .svc a:hover{border-color:var(--flame)}
.p-operator .svc a i{font-style:normal;color:#B6BEC8}
.p-operator .faq details{border-top:1px solid #E6E9ED}
.p-operator .faq details:last-of-type{border-bottom:1px solid #E6E9ED}
.p-operator .faq summary{list-style:none;cursor:pointer;padding:19px 0;display:flex;gap:16px;
  font-family:var(--display);font-size:16.5px;font-weight:700}
.p-operator .faq summary::-webkit-details-marker{display:none}
.p-operator .faq summary::after{content:'+';margin-left:auto;color:var(--flame);font-size:20px;font-weight:400}
.p-operator .faq details[open] summary::after{content:'\2212'}
.p-operator .faq p{margin:0 0 20px;font-size:15px;line-height:1.68;color:#5A6675;max-width:74ch}
.p-operator footer{padding:36px 0;color:#8A94A1;font-size:13.5px;display:flex;flex-wrap:wrap;gap:14px}
.p-operator footer a{color:#5A6675}

/* ============================================================
   ==============  DIRECTION 3 — PRACTICE  ====================
   Vertical-first. Leads with the industry and its actual pain,
   in their own words, then the automation that removes it.
   ============================================================ */
.p-practice{background:#fff;color:#111A22;font-size:16px}
.p-practice .nav{display:flex;align-items:center;gap:26px;padding:18px 0}
.p-practice .mark{display:block;flex:none}
.p-practice .nav .links{display:flex;gap:22px;margin-left:auto}
.p-practice .nav .links a{color:#4E5A66;font-size:13.5px;font-weight:700}
.p-practice .nav .tel{padding:11px 20px;border-radius:8px;background:var(--flame);color:#fff;
  font-size:14px;font-weight:800}
.p-practice .hero{background:#0E1620;color:#fff;padding:clamp(46px,6vw,80px) 0}
.p-practice .hero .wrap{display:grid;grid-template-columns:1fr .82fr;gap:clamp(28px,4vw,56px);align-items:center}
.p-practice .badge{display:inline-flex;align-items:center;gap:9px;padding:7px 13px;border-radius:6px;
  background:rgba(255,255,255,.08);margin-bottom:20px;font-family:var(--mono);font-size:11.5px;color:#B7C4D0}
.p-practice .badge i{width:6px;height:6px;border-radius:50%;background:var(--live);font-style:normal}
.p-practice h1{font-family:var(--display);font-weight:900;font-size:clamp(30px,4.4vw,54px);
  line-height:1.05;letter-spacing:-.024em;margin:0 0 18px;text-wrap:balance}
.p-practice h1 em{font-style:normal;color:var(--amber)}
.p-practice .lede{font-size:16.5px;line-height:1.6;color:#B7C4D0;max-width:50ch;margin:0 0 26px}
.p-practice .cta{display:flex;flex-wrap:wrap;gap:12px}
.p-practice .b1{padding:15px 28px;border-radius:8px;background:var(--flame);color:#fff;font-size:15.5px;font-weight:800}
.p-practice .b2{padding:15px 26px;border-radius:8px;border:1px solid rgba(255,255,255,.28);color:#fff;
  font-size:15.5px;font-weight:700}
.p-practice .picker{background:#fff;color:#111A22;border-radius:12px;padding:22px;
  box-shadow:0 20px 50px rgba(0,0,0,.3)}
.p-practice .picker h3{font-family:var(--display);font-size:18px;font-weight:800;margin:0 0 4px}
.p-practice .picker p{font-size:13.5px;color:#5A6673;margin:0 0 16px;line-height:1.5}
.p-practice .picker a{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;border:1px solid #E6E9ED;border-radius:9px;margin-bottom:9px;color:#111A22;
  font-size:14.5px;font-weight:700;transition:border-color .16s ease-out,background .16s ease-out}
.p-practice .picker a:hover{border-color:var(--flame);background:#FFF6F3}
.p-practice .picker a span{font-family:var(--mono);font-size:11px;color:#8A94A1;font-weight:400}

.p-practice section{padding:clamp(50px,6vw,84px) 0}
.p-practice .alt{background:#F5F7F9}
.p-practice .kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--flame);margin:0 0 12px}
.p-practice h2{font-family:var(--display);font-weight:900;font-size:clamp(25px,3.3vw,40px);
  line-height:1.12;letter-spacing:-.022em;margin:0 0 14px;max-width:22ch;text-wrap:balance}
.p-practice .sec-lede{font-size:16.5px;line-height:1.6;color:#5A6673;max-width:60ch;margin:0 0 40px}
.p-practice .verticals{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.p-practice .vert{border:2px solid #E6E9ED;border-radius:14px;overflow:hidden;background:#fff}
.p-practice .vert .top{padding:20px 22px;background:#0E1620;color:#fff}
.p-practice .vert .top h3{font-family:var(--display);font-size:19px;font-weight:800;margin:0 0 4px}
.p-practice .vert .top p{margin:0;font-family:var(--mono);font-size:11.5px;color:#8FA1B0}
.p-practice .vert .body{padding:20px 22px}
.p-practice .vert .row{padding:14px 0;border-bottom:1px solid #EDF0F3}
.p-practice .vert .row:last-child{border-bottom:0}
.p-practice .vert .row b{display:block;font-size:14.5px;font-weight:800;margin-bottom:5px;color:#111A22}
.p-practice .vert .row span{display:flex;gap:8px;font-size:13.5px;color:#5A6673;line-height:1.5}
.p-practice .vert .row span i{color:var(--live);font-style:normal;font-weight:800}
.p-practice .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.p-practice .step{padding:22px;border:2px solid #E6E9ED;border-radius:12px;background:#fff}
.p-practice .step .n{font-family:var(--mono);font-size:11.5px;color:var(--flame);display:block;margin-bottom:12px}
.p-practice .step h3{font-family:var(--display);font-size:17px;font-weight:800;margin:0 0 8px}
.p-practice .step p{font-size:14px;line-height:1.58;color:#5A6673;margin:0}
.p-practice .svc{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.p-practice .svc a{padding:17px;border:2px solid #E6E9ED;border-radius:10px;color:#111A22;
  font-size:14.5px;font-weight:700;display:flex;justify-content:space-between;gap:10px;background:#fff}
.p-practice .svc a:hover{border-color:var(--flame)}
.p-practice .svc a i{font-style:normal;color:var(--flame)}
.p-practice .faq details{border:2px solid #E6E9ED;border-radius:10px;margin-bottom:11px;background:#fff}
.p-practice .faq summary{list-style:none;cursor:pointer;padding:19px 21px;display:flex;gap:14px;
  font-family:var(--display);font-size:16.5px;font-weight:800}
.p-practice .faq summary::-webkit-details-marker{display:none}
.p-practice .faq summary::after{content:'+';margin-left:auto;color:var(--flame);font-size:22px;font-weight:400;line-height:1}
.p-practice .faq details[open]{border-color:var(--flame)}
.p-practice .faq details[open] summary::after{content:'\2212'}
.p-practice .faq p{margin:0;padding:0 21px 20px;font-size:15px;line-height:1.66;color:#5A6673;max-width:76ch}
.p-practice footer{background:#0E1620;color:#8FA1B0;padding:38px 0;font-size:13.5px}
.p-practice footer .wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.p-practice footer a{color:#C7D2DC}

/* ---------- shared partner strip ---------- */
.gp{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;color:inherit}
.p-signal .gp{color:var(--fg-2)}.p-signal .gp b{color:var(--fg);font-weight:700}
.p-operator .gp{color:#5A6675}.p-operator .gp b{color:#0D1520;font-weight:700}
.p-practice .gp{color:#B7C4D0}.p-practice .gp b{color:#fff;font-weight:700}
.gp .sq{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:16px;height:16px;flex:none}
.gp .sq s{display:block;width:100%;height:100%;border-radius:1px;text-decoration:none}
.gp .sq s:nth-child(1){background:#4285F4}.gp .sq s:nth-child(2){background:#EA4335}
.gp .sq s:nth-child(3){background:#FBBC04}.gp .sq s:nth-child(4){background:#34A853}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .p-signal .hero-in,.p-practice .hero .wrap{grid-template-columns:1fr}
  .p-signal .steps,.p-operator .steps,.p-practice .steps,
  .p-signal .svc,.p-operator .svc,.p-practice .svc{grid-template-columns:1fr 1fr}
  .p-signal .pains,.p-operator .pains,.p-practice .verticals{grid-template-columns:1fr}
  .p-operator .lanes{grid-template-columns:1fr 1fr}
  .p-operator .lane{border-bottom:1px solid #EDF0F3}
}
@media (max-width:720px){
  .p-signal .nav .links,.p-operator .nav .links,.p-practice .nav .links{display:none}
  .p-signal .nav .tel,.p-operator .nav .tel,.p-practice .nav .tel{margin-left:auto}
  .p-signal .steps,.p-operator .steps,.p-practice .steps,
  .p-signal .svc,.p-operator .svc,.p-practice .svc{grid-template-columns:1fr}
  .p-operator .lanes{grid-template-columns:1fr}
  .p-signal .hero-in{min-height:0;padding-bottom:110px}
  .p-signal .svc a,.p-operator .svc a,.p-practice .svc a,
  .p-practice .picker a{min-width:0}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .p-signal .rev{opacity:1;transform:none;transition:none}
}

.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;

.proto-picker-item:hover{color:rgba(255,255,255,.85)}

/* =============================================================
   MOTION — Signal only. An automation graph: jobs enter, route
   through steps, and clear. This is the brand, not decoration.
   ============================================================= */
function attachSignalMotion(root){
  const stops=[];

  const revs=[...root.querySelectorAll('.rev')];
  if(REDUCED){ revs.forEach(e=>e.classList.add('in')); }
  else{
    const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
      e.target.classList.add('in'); io.unobserve(e.target);}});},
      {rootMargin:'0px 0px -8% 0px',threshold:.06});
    revs.forEach(e=>io.observe(e)); stops.push(()=>io.disconnect());
  }

  const host=root.querySelector('.hero-bg');
  const cv=document.createElement('canvas');
  host.insertBefore(cv,host.firstChild);
  const ctx=cv.getContext('2d');
  let w=0,h=0,dpr=1,small=false;

  // normalised layout; drawn into the right-hand 58% so hero copy stays clean
  const NODES=[
    {x:.04,y:.50,l:'intake'},   {x:.24,y:.24,l:'qualify'}, {x:.24,y:.76,l:'enrich'},
    {x:.46,y:.50,l:'route'},    {x:.68,y:.18,l:'schedule'},{x:.68,y:.50,l:'quote'},
    {x:.68,y:.82,l:'follow-up'},{x:.88,y:.32,l:'crm'},     {x:.88,y:.68,l:'report'}
  ];
  const ROUTES=[[0,1,3,4,7],[0,2,3,5,7],[0,1,3,6,8],[0,2,3,6,8],[0,1,3,5,7]];
  const EDGES=[];
  ROUTES.forEach(r=>{for(let i=0;i<r.length-1;i++){
    const k=r[i]+'-'+r[i+1];
    if(!EDGES.some(e=>e.k===k)) EDGES.push({k,a:r[i],b:r[i+1]});
  }});

  const MAXP=26;
  let packets=[], pulses=[];
  // Full-bleed schematic. It previously occupied the right 56%, which put the
  // console panel straight through the middle of the graph and made it read as
  // random noise. Spanning the hero and dropping the alpha reads as intent.
  function px(n){ return (0.05 + NODES[n].x*0.90) * w; }
  function py(n){ return (0.10 + NODES[n].y*0.80) * h; }

  function size(){
    const r=host.getBoundingClientRect();
    dpr=Math.min(devicePixelRatio||1,1.5);           // capped: biggest lag guard
    w=Math.max(1,Math.round(r.width)); h=Math.max(1,Math.round(r.height));
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    small = w < 900;                                  // graph is noise on a phone
  }
  function spawn(){
    if(packets.length>=MAXP) return;
    packets.push({r:ROUTES[(Math.random()*ROUTES.length)|0],i:0,t:Math.random()*0.2,
                  sp:0.30+Math.random()*0.30});
  }
  size(); for(let i=0;i<10;i++) spawn();
  const ro=new ResizeObserver(size); ro.observe(host); stops.push(()=>ro.disconnect());

  let acc=0;
  function step(dt){
    acc+=dt; if(acc>0.5){acc=0; spawn();}
    for(let k=packets.length-1;k>=0;k--){
      const p=packets[k]; p.t+=dt*p.sp;
      while(p.t>=1){
        p.t-=1; p.i++;
        if(p.i>=p.r.length-1){ pulses.push({n:p.r[p.r.length-1],t:0}); packets.splice(k,1); break; }
        pulses.push({n:p.r[p.i],t:0});
      }
    }
    for(let k=pulses.length-1;k>=0;k--){ pulses[k].t+=dt*1.8; if(pulses[k].t>1) pulses.splice(k,1); }
  }

  function draw(time){
    ctx.clearRect(0,0,w,h);
    if(small) return;                                  // nothing to draw on narrow screens

    // edges
    ctx.lineWidth=1;
    ctx.strokeStyle='rgba(39,58,71,0.20)';
    EDGES.forEach(e=>{
      const x1=px(e.a),y1=py(e.a),x2=px(e.b),y2=py(e.b),mx=(x1+x2)/2;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.bezierCurveTo(mx,y1,mx,y2,x2,y2); ctx.stroke();
    });

    // nodes
    NODES.forEach((n,i)=>{
      const x=px(i),y=py(i);
      ctx.fillStyle='rgba(255,255,255,0.98)';
      ctx.strokeStyle='rgba(39,58,71,0.38)';
      ctx.beginPath(); ctx.arc(x,y,5.5,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.font='500 10px "JetBrains Mono", monospace';
      ctx.fillStyle='rgba(39,58,71,0.42)';
      ctx.textAlign='center'; ctx.fillText(n.l,x,y-13);
    });

    // pulses
    pulses.forEach(p=>{
      const x=px(p.n),y=py(p.n),r=5.5+p.t*15;
      ctx.strokeStyle='rgba(30,170,110,'+((1-p.t)*0.42).toFixed(3)+')';
      ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
    });

    // packets travelling along their bezier
    packets.forEach(p=>{
      const a=p.r[p.i],b=p.r[p.i+1]; if(b===undefined) return;
      const x1=px(a),y1=py(a),x2=px(b),y2=py(b),mx=(x1+x2)/2,t=p.t,u=1-t;
      const x=u*u*u*x1+3*u*u*t*mx+3*u*t*t*mx+t*t*t*x2;
      const y=u*u*u*y1+3*u*u*t*y1+3*u*t*t*y2+t*t*t*y2;
      const g=ctx.createRadialGradient(x,y,0,x,y,9);
      g.addColorStop(0,'rgba(234,69,23,0.30)'); g.addColorStop(1,'rgba(234,69,23,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,9,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(214,55,12,0.95)'; ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
    });
  }

  if(REDUCED){ for(let k=0;k<60;k++) step(0.05); draw(0); return ()=>stops.forEach(f=>f()); }

  let raf=0,last=performance.now(),dead=false,visible=true;
  function frame(now){
    if(dead) return;
    const dt=Math.min((now-last)/1000,0.05); last=now;
    step(dt); draw(now/1000);
    raf=requestAnimationFrame(frame);
  }
  function run(on){ cancelAnimationFrame(raf); if(on&&!dead&&!document.hidden){ last=performance.now(); raf=requestAnimationFrame(frame);} }
  const vio=new IntersectionObserver(es=>{visible=es[0].isIntersecting; run(visible);},{threshold:0});
  vio.observe(host);
  const onVis=()=>run(visible&&!document.hidden);
  document.addEventListener('visibilitychange',onVis);
  raf=requestAnimationFrame(frame);
  stops.push(()=>{dead=true;cancelAnimationFrame(raf);vio.disconnect();
    document.removeEventListener('visibilitychange',onVis);});
  return ()=>stops.forEach(f=>f());
}

/* ============================ PICKER ============================ */
const variants=[
  {name:'Signal',   render:renderSignal, motion:attachSignalMotion},
  {name:'Operator', render:renderOperator},
  {name:'Practice', render:renderPractice}
];
const stage=document.getElementById('stage');
const picker=document.querySelector('.proto-picker');
const highlight=picker.querySelector('.proto-picker-highlight');
const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay=picker.querySelector('.proto-picker-replay');
let current=0, teardown=null;

function moveHighlight(){const el=items[current];
  highlight.style.width=el.offsetWidth+'px';
  highlight.style.transform='translateX('+el.offsetLeft+'px)';}

function mount(i){
  if(teardown){teardown();teardown=null;}
  stage.innerHTML=''; window.scrollTo(0,0);
  requestAnimationFrame(()=>{ stage.innerHTML=variants[i].render();
    teardown=variants[i].motion?variants[i].motion(stage):null; });
}
function setActive(i){
  if(i<0||i>=variants.length) return;
  current=i;
  items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);
    if(j===i) el.setAttribute('aria-current','true'); else el.removeAttribute('aria-current');});
  moveHighlight();
  try{const u=new URL(location);u.searchParams.set('v',i+1);history.replaceState(null,'',u);}catch(_){}
  mount(i);
}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
replay?.addEventListener('click',()=>mount(current));
window.addEventListener('resize',moveHighlight);
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=variants.length) setActive(n-1);
  else if(e.key==='ArrowRight') setActive((current+1)%variants.length);
  else if(e.key==='ArrowLeft') setActive((current-1+variants.length)%variants.length);
  else if(e.key==='r'||e.key==='R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);
requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
})();
</script>
</body>
</html>
